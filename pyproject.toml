[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "searchability-obligations"
version = "0.1.0"
description = "Reproducible research prototype for impact-bounded ANN freshness"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "Research prototype; see repository license status"}
authors = [{name = "Searchability Obligations contributors"}]
dependencies = [
  "faiss-cpu==1.15.0",
  "numpy==2.2.6",
]

[project.optional-dependencies]
test = [
  "hypothesis==6.167.1",
  "pytest==9.1.1",
]
report = [
  "matplotlib==3.10.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "evaluation: full 10,000-case or resource-intensive validation",
  "crash: subprocess crash/fault-injection validation",
]

