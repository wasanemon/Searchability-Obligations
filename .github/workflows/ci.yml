name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1 setuptools==84.0.0 wheel==0.48.0
      - run: python -m pip install --requirement requirements-lock.txt
      - run: python -m pip install --no-build-isolation --no-deps --editable .
      - run: python -m pytest -m "not evaluation"
